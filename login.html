<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Gestión de Egresados - CENFOTEC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="assets/logo-cenfotec.png" alt="Logo Universidad CENFOTEC">
      <span>CENFOTEC | Egresados</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="egresados.html">Gestión de egresados</a></li>
        <li><a href="carreras.html">Gestión de carreras</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Iniciar sesión</h1>
      <form action="#" method="post">
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="usuario@ucenfotec.ac.cr" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
        </div>

        <button type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Universidad CENFOTEC. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
